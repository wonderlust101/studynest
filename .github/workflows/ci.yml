name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # None of these steps touch the database, so CI needs no real DATABASE_URL.
      SKIP_ENV_VALIDATION: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Next.js, tsc and Vitest run on Node even when started through bun.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
