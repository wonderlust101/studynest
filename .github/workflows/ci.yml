name: CI

on:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      # None of these steps call the API, so CI needs no real API_URL.
      SKIP_ENV_VALIDATION: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Next.js, tsc and Vitest run on Node even when started through bun.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy app tests
      # The tests replace the database with a fake, so CI needs no DATABASE_URL.
      - run: uv run pytest
