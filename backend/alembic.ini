# Alembic is the migration tool, like drizzle-kit. The database URL is not here:
# migrations/env.py gets it from app/config.py.
[alembic]
script_location = %(here)s/migrations
# Lets migrations/env.py run `import app` from the backend/ folder.
prepend_sys_path = .

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
