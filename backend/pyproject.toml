[project]
name = "studynest-backend"
version = "0.1.0"
description = "StudyNest API"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn>=0.54.0",
]

[tool.uv]
# This is an application, not a library, so uv doesn't need to build or install it.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets tests run `import app` from the backend/ folder.
pythonpath = ["."]

[tool.ruff.lint]
# E/F: common errors, I: import sorting, UP: modern syntax, B: likely bugs.
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
# Teaches mypy how Pydantic builds a class's constructor from its fields.
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
