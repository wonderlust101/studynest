# Local development only. The password is a throwaway value, and the port is
# bound to 127.0.0.1 so nothing outside this machine can reach it.
services:
  # Postgres with the pgvector extension available. Use the same major version
  # for your Neon project so local and production behave alike.
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: main
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 images keep their data in a versioned folder inside this path.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
